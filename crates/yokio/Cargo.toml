[package]
name = "yokio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A callback-native asynchronous execution engine for Rust"

[features]
default = []
test-util = []

[dependencies]
yokio-macros = { version = "0.1.0", path = "../yokio-macros" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true }

[lints]
workspace = true
