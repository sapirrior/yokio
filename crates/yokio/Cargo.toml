[package]
name = "yokio"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A callback-native asynchronous execution engine for Rust"
readme = "README.md"
keywords = ["async", "event-loop", "callbacks", "epoll", "timer"]
categories = ["asynchronous", "network-programming"]

[features]
default = []
test-util = []

[dependencies]
yokio-macros = { version = "0.1.0", path = "../yokio-macros" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_Networking_WinSock",
] }

[lints]
workspace = true
