[package]
name = "yokio"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A callback-native asynchronous execution engine for Rust"
license = "MIT OR Apache-2.0"
readme = "README.md"

[features]
default = []
test-util = []
uring = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.bench]
inherits = "release"
debug = true
